name: Publish

on:
  release:
    types: [created]

jobs:
  publish-to-jsr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: 2.x
      - name: Run test
        run: deno task test:deno
      - name: Run deno publish
        run: deno publish

  publish-to-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: 2.x
      - name: Build npm packages
        run: deno task npm
      - name: Publish updated packages to npm
        run: |
          err_log=$(mktemp)
          publish_if_needed() {
            local dir="./npm/packages/$1"
            local name version published
            name=$(node --input-type=module -e "import p from '$dir/package.json' with { type: 'json' }; console.log(p.name)")
            version=$(node --input-type=module -e "import p from '$dir/package.json' with { type: 'json' }; console.log(p.version)")
            # Check whether this exact version exists (not just the "latest" dist-tag).
            # E404 means the version (or the package itself) is not published yet; any other error is fatal.
            if ! published=$(npm view "$name@$version" version 2>"$err_log"); then
              if grep -q "E404" "$err_log"; then
                published=""
              else
                cat "$err_log" >&2
                echo "::error::Failed to query the registry for $name@$version"
                exit 1
              fi
            fi
            if [ -n "$published" ]; then
              echo "::notice::Skipped $name@$version (already published)"
              return
            fi
            echo "Publishing $name@$version"
            if ! npm publish "$dir"; then
              echo "::error::Failed to publish $name@$version"
              exit 1
            fi
          }
          # Publish in dependency order: common → core → extension packages
          publish_if_needed common
          publish_if_needed core
          publish_if_needed chacha20poly1305
          publish_if_needed dhkem-x25519
          publish_if_needed dhkem-x448
          publish_if_needed dhkem-secp256k1
          publish_if_needed hybridkem-x25519-kyber768
          publish_if_needed hybridkem-x-wing
          publish_if_needed hpke-js
          publish_if_needed ml-kem
          publish_if_needed cose
          publish_if_needed jose
          publish_if_needed ohttp
