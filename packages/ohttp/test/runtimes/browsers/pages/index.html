<html>
  <head>
    <title>@hpke/ohttp test</title>
  </head>
  <body>
    <script type="module">
    import { OhttpClient, OhttpServer } from "./src/hpke-ohttp.js";
    import {
      Aes128Gcm,
      Aes256Gcm,
      CipherSuite,
      DhkemP256HkdfSha256,
      DhkemX25519HkdfSha256,
      HkdfSha256,
    } from "./src/hpke-core.js";

    function toHex(buf) {
      if (buf === undefined) {
        return undefined;
      }
      return Array.from(new Uint8Array(buf))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
    }

    function describeError(e) {
      if (e instanceof Error) {
        return `${e.name}: ${e.message}`;
      }
      return String(e);
    }

    // Records the intermediate values of a round trip so that a failure can be
    // reproduced with fixed inputs.
    async function testRoundtrip(kem, kdf, aead, trace) {
      trace.step = "generateKeyPair";
      const suite = new CipherSuite({ kem, kdf, aead });
      const keyPair = await suite.kem.generateKeyPair();
      trace.step = "serializeKeyPair";
      trace.skR = toHex(await suite.kem.serializePrivateKey(keyPair.privateKey));
      trace.pkR = toHex(await suite.kem.serializePublicKey(keyPair.publicKey));

      const server = new OhttpServer({
        keyId: 0x01,
        kem,
        privateKey: keyPair.privateKey,
        publicKey: keyPair.publicKey,
        kdfAeadPairs: [{ kdf, aead }],
      });
      trace.step = "publicKeyConfig";
      const keyConfig = await server.publicKeyConfig;
      const client = new OhttpClient({
        kem,
        kdf,
        aead,
        keyConfig,
        relayUrl: "https://relay.example/ohttp",
      });
      const targetReq = new Request("https://target.example/api", {
        method: "POST",
        body: "hello world!",
      });
      trace.step = "encapsulateRequest";
      const clientCtx = await client.encapsulateRequest(targetReq);
      // The encapsulated request contains the ephemeral public key (enc).
      trace.encRequest = toHex(clientCtx.encRequest);
      trace.step = "decapsulateRequest";
      const serverCtx = await server.decapsulateRequest(
        clientCtx.encRequest,
      );
      const body = await serverCtx.request.text();
      if (body !== "hello world!") {
        throw new Error("body mismatch: " + body);
      }
      trace.step = "encapsulateResponse";
      const encRes = await serverCtx.encapsulateResponse(
        new Response("ok from server"),
      );
      trace.step = "decapsulateResponse";
      const res = await clientCtx.decapsulateResponse(encRes);
      const resBody = await res.text();
      if (resBody !== "ok from server") {
        throw new Error("response mismatch: " + resBody);
      }
    }

    const CASES = [
      {
        name: "X25519/AES-128-GCM",
        kem: () => new DhkemX25519HkdfSha256(),
        aead: () => new Aes128Gcm(),
      },
      {
        name: "X25519/AES-256-GCM",
        kem: () => new DhkemX25519HkdfSha256(),
        aead: () => new Aes256Gcm(),
      },
      {
        name: "P-256/AES-128-GCM",
        kem: () => new DhkemP256HkdfSha256(),
        aead: () => new Aes128Gcm(),
      },
    ];

    globalThis.run = async () => {
      let pass = 0;
      let fail = 0;
      const errors = [];

      for (const c of CASES) {
        const trace = { name: c.name };
        try {
          await testRoundtrip(c.kem(), new HkdfSha256(), c.aead(), trace);
          pass++;
        } catch (e) {
          trace.error = describeError(e);
          console.error(JSON.stringify(trace));
          errors.push(trace);
          fail++;
        }
      }

      document.getElementById("errors").textContent = errors.length > 0
        ? JSON.stringify(errors, null, 2)
        : "";
      document.getElementById("pass").innerHTML = pass;
      document.getElementById("fail").innerHTML = fail;
    };

    globalThis.reset = () => {
      document.getElementById("pass").innerHTML = "-";
      document.getElementById("fail").innerHTML = "-";
      document.getElementById("errors").textContent = "";
    };
    </script>

    <h1>
      <a href="https://github.com/dajiaji/hpke-js">@hpke/ohttp</a>
      test
    </h1>

    <div id="operation">
      <button type="button" onclick="run()">run</button>
      <button type="button" onclick="reset()">reset</button>
    </div>

    <br />

    <div id="test">
      <table>
        <tr>
          <th>
            <font color="green">pass:</font>
          </th>
          <td id="pass">-</td>
        </tr>
        <tr>
          <th>
            <font color="red">fail:</font>
          </th>
          <td id="fail">-</td>
        </tr>
      </table>
      <pre id="errors"></pre>
    </div>

    <p><a href="./stress.html">stress test</a></p>
  </body>
</html>
