<html>
  <head>
    <title>@hpke/ohttp stress test</title>
  </head>
  <body>
    <script type="module">
    import { DhkemP256HkdfSha256, DhkemX25519HkdfSha256 } from "./src/hpke-core.js";

    // Repeats the KEM operations used by OHTTP with random keys to catch
    // failures that only happen for specific key values (e.g. values with a
    // leading 0x00 byte). The number of iterations can be set with `?n=`.
    const DEFAULT_ITERATIONS = 300;
    const MAX_RECORDED_FAILURES = 20;

    const KEMS = [
      { name: "X25519", create: () => new DhkemX25519HkdfSha256() },
      { name: "P-256", create: () => new DhkemP256HkdfSha256() },
    ];

    function toHex(buf) {
      if (buf === undefined) {
        return undefined;
      }
      return Array.from(new Uint8Array(buf))
        .map((b) => b.toString(16).padStart(2, "0"))
        .join("");
    }

    function describeError(e) {
      if (e instanceof Error) {
        return `${e.name}: ${e.message}`;
      }
      return String(e);
    }

    function equal(a, b) {
      const x = new Uint8Array(a);
      const y = new Uint8Array(b);
      return x.length === y.length && x.every((v, i) => v === y[i]);
    }

    // Returns the names of the fields whose value starts with 0x00.
    // For P-256 public keys, the first byte (0x04) is skipped and the
    // x-coordinate and y-coordinate are checked.
    function leadingZeros(rec, isEc) {
      const res = [];
      for (const [k, v] of Object.entries(rec)) {
        if (typeof v !== "string") {
          continue;
        }
        if (isEc && (k === "pkR" || k === "pkE")) {
          const half = (v.length - 2) / 2;
          if (v.startsWith("00", 2)) res.push(`${k}.x`);
          if (v.startsWith("00", 2 + half)) res.push(`${k}.y`);
          continue;
        }
        if (v.startsWith("00")) {
          res.push(k);
        }
      }
      return res;
    }

    function expectLength(name, buf, len) {
      if (buf.byteLength !== len) {
        throw new Error(`${name} length ${buf.byteLength} !== ${len}`);
      }
    }

    async function roundtrip(kem, ekm, pkR, skR, rec, label) {
      rec.step = `${label}:encap`;
      const { sharedSecret, enc } = await kem.encap({
        recipientPublicKey: pkR,
        ekm,
      });
      rec.step = `${label}:decap`;
      const ss = await kem.decap({ enc, recipientKey: skR });
      if (!equal(sharedSecret, ss)) {
        rec.ssSender = toHex(sharedSecret);
        rec.ssRecipient = toHex(ss);
        throw new Error("shared secret mismatch");
      }
    }

    async function iterate(kem, isEc, rec) {
      // (A) keys generated by generateKey.
      rec.step = "generateKeyPair";
      const kpR = await kem.generateKeyPair();
      const kpE = await kem.generateKeyPair();

      rec.step = "serialize";
      const skR = await kem.serializePrivateKey(kpR.privateKey);
      rec.skR = toHex(skR);
      const pkR = await kem.serializePublicKey(kpR.publicKey);
      rec.pkR = toHex(pkR);
      const skE = await kem.serializePrivateKey(kpE.privateKey);
      rec.skE = toHex(skE);
      const pkE = await kem.serializePublicKey(kpE.publicKey);
      rec.pkE = toHex(pkE);
      expectLength("skR", skR, kem.privateKeySize);
      expectLength("pkR", pkR, kem.publicKeySize);
      expectLength("skE", skE, kem.privateKeySize);
      expectLength("pkE", pkE, kem.publicKeySize);

      await roundtrip(kem, kpE, kpR.publicKey, kpR.privateKey, rec, "A");

      // (B) the same keys re-imported from the serialized form (PKCS#8 / raw).
      rec.step = "deserialize";
      const kpR2 = {
        privateKey: await kem.deserializePrivateKey(skR),
        publicKey: await kem.deserializePublicKey(pkR),
      };
      const kpE2 = {
        privateKey: await kem.deserializePrivateKey(skE),
        publicKey: await kem.deserializePublicKey(pkE),
      };
      await roundtrip(kem, kpE2, kpR2.publicKey, kpR2.privateKey, rec, "B");

      // (C) a recipient key derived by deriveKeyPair.
      const ikm = crypto.getRandomValues(new Uint8Array(32));
      rec.ikm = toHex(ikm);
      rec.step = "deriveKeyPair";
      const kpR3 = await kem.deriveKeyPair(ikm);
      rec.step = "serializeDerivedKeyPair";
      rec.skR3 = toHex(await kem.serializePrivateKey(kpR3.privateKey));
      rec.pkR3 = toHex(await kem.serializePublicKey(kpR3.publicKey));
      await roundtrip(kem, kpE, kpR3.publicKey, kpR3.privateKey, rec, "C");
    }

    // A fixed private key whose first byte is 0x00. This is a valid scalar for
    // both X25519 and P-256 (non-zero and less than the P-256 order).
    const FIXED_SK_LEADING_ZERO = new Uint8Array(32).map((_, i) => i);

    async function exportJwk(key) {
      const api = crypto.subtle;
      try {
        return await api.exportKey("jwk", key);
      } catch {
        // Firefox cannot export a JWK from an ECDH private key imported from
        // a PKCS#8 without the public key (Mozilla bug 2000795).
        const reimported = await api.importKey(
          "pkcs8",
          await api.exportKey("pkcs8", key),
          key.algorithm,
          true,
          key.usages,
        );
        return await api.exportKey("jwk", reimported);
      }
    }

    // Deterministic regression check for a private key with a leading 0x00.
    async function fixedVector(kem, rec) {
      rec.skR = toHex(FIXED_SK_LEADING_ZERO);
      rec.step = "fixed:deserializePrivateKey";
      const skR = await kem.deserializePrivateKey(FIXED_SK_LEADING_ZERO);
      rec.step = "fixed:serializePrivateKey";
      const skR2 = await kem.serializePrivateKey(skR);
      if (!equal(skR2, FIXED_SK_LEADING_ZERO)) {
        rec.skR2 = toHex(skR2);
        throw new Error("private key round trip mismatch");
      }
      rec.step = "fixed:importPublicKey";
      const jwk = await exportJwk(skR);
      delete jwk.d;
      delete jwk.key_ops;
      const pkR = await kem.importKey("jwk", jwk, true);
      rec.pkR = toHex(await kem.serializePublicKey(pkR));
      const kpE = await kem.generateKeyPair();
      await roundtrip(kem, kpE, pkR, skR, rec, "fixed");
    }

    globalThis.run = async () => {
      const n = Number(
        new URLSearchParams(location.search).get("n") ?? DEFAULT_ITERATIONS,
      );
      const summary = {};
      const failures = [];

      for (const k of KEMS) {
        const kem = k.create();
        const isEc = k.name.startsWith("P-");
        const s = { iterations: n, fail: 0, byStep: {}, byLeadingZero: {} };
        const fixedRec = { kem: k.name, iteration: "fixed" };
        try {
          await fixedVector(kem, fixedRec);
        } catch (e) {
          fixedRec.error = describeError(e);
          s.fail++;
          s.byStep[fixedRec.step] = 1;
          console.error(JSON.stringify(fixedRec));
          failures.push(fixedRec);
        }
        const start = performance.now();
        for (let i = 0; i < n; i++) {
          const rec = { kem: k.name, iteration: i };
          try {
            await iterate(kem, isEc, rec);
          } catch (e) {
            rec.error = describeError(e);
            rec.leadingZeros = leadingZeros(rec, isEc);
            s.fail++;
            s.byStep[rec.step] = (s.byStep[rec.step] ?? 0) + 1;
            for (const z of rec.leadingZeros) {
              s.byLeadingZero[z] = (s.byLeadingZero[z] ?? 0) + 1;
            }
            console.error(JSON.stringify(rec));
            if (failures.length < MAX_RECORDED_FAILURES) {
              failures.push(rec);
            }
          }
        }
        s.elapsedMs = Math.round(performance.now() - start);
        summary[k.name] = s;
      }

      const total = Object.values(summary).reduce((a, s) => a + s.fail, 0);
      document.getElementById("summary").textContent = JSON.stringify(
        summary,
        null,
        2,
      );
      document.getElementById("errors").textContent = failures.length > 0
        ? JSON.stringify(failures, null, 2)
        : "";
      document.getElementById("fail").textContent = total;
    };
    </script>

    <h1>
      <a href="https://github.com/dajiaji/hpke-js">@hpke/ohttp</a>
      stress test
    </h1>

    <div id="operation">
      <button type="button" onclick="run()">run</button>
    </div>

    <br />

    <div id="test">
      <table>
        <tr>
          <th>
            <font color="red">fail:</font>
          </th>
          <td id="fail">-</td>
        </tr>
      </table>
      <pre id="summary"></pre>
      <pre id="errors"></pre>
    </div>
  </body>
</html>
